<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObsiStickeyNoy 设置</title>
    <style>
      body {
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        margin: 0;
        padding: 24px;
        background: #f5f5f5;
        color: #222;
      }
      h1 { font-size: 18px; margin: 0 0 16px; }
      label { display: block; font-size: 13px; margin-bottom: 6px; color: #555; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      button {
        padding: 8px 14px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #e0e0e0;
        cursor: pointer;
      }
      button:hover { background: #d0d0d0; }
      #save-btn { background: #ffd65c; }
      #save-btn:hover { background: #f0c84e; }
      #status { font-size: 13px; color: #666; margin-top: 8px; min-height: 18px; }
      .hint { font-size: 12px; color: #999; margin: -6px 0 12px; }
      .widget-style-block {
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
        background: #fafafa;
      }
      .ws-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
      .ws-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        flex-wrap: wrap;
      }
      .ws-label { font-size: 12px; color: #555; white-space: nowrap; }
      .ws-val { font-size: 12px; color: #555; width: 34px; text-align: right; }
      .ws-row input[type="color"] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
      }
      .ws-check { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #555; margin: 0; }
      .ws-select {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 3px 6px;
        font-size: 12px;
        background: #fff;
      }
      .widget-style-block .hint { margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <h1>ObsiStickeyNoy 设置</h1>
    <label for="vault-path">Obsidian 库路径</label>
    <input id="vault-path" type="text" placeholder="例如 D:\MyVault" />
    <div class="hint">便笺将存放在库的 Obsi_StickeyNoy/ 目录（Markdown 文件，Obsidian 可直接编辑）</div>
    <button id="save-btn">保存并加载</button>
    <div class="row" style="margin-top: 16px">
      <button id="resync-btn">重新同步桌面网格</button>
      <button id="showall-btn">显示全部便笺</button>
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:6px;margin:0;color:#333">
        <input type="checkbox" id="autostart-chk" /> 开机自动启动
      </label>
    </div>
    <div class="row" style="gap:18px">
      <label style="display:flex;align-items:center;gap:6px;margin:0;color:#333">
        <input type="checkbox" id="widget-calendar-chk" /> 日历小组件
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin:0;color:#333">
        <input type="checkbox" id="widget-clock-chk" /> 时钟小组件
      </label>
    </div>
    <div class="widget-style-block">
      <div class="ws-title">时钟小组件样式</div>
      <div class="ws-row">
        <span class="ws-label">背景色</span>
        <input type="color" id="clock-bg" value="#ffffff" />
        <span class="ws-label">透明度</span>
        <input type="range" id="clock-bgalpha" min="0" max="100" value="78" style="flex:1" />
        <span id="clock-bgalpha-v" class="ws-val">78%</span>
      </div>
      <div class="ws-row">
        <span class="ws-label">字体色</span>
        <input type="color" id="clock-fg" value="#1f1f1f" />
        <span class="ws-label">数字字体</span>
        <select id="clock-font" class="ws-select">
          <option value="square">方正（Bahnschrift）</option>
          <option value="round">圆润（Segoe UI）</option>
          <option value="mono">等宽（Consolas）</option>
        </select>
        <label class="ws-check">
          <input type="checkbox" id="clock-nobg" /> 仅数字（无背景，透过看壁纸）
        </label>
      </div>
    </div>
    <div class="widget-style-block">
      <div class="ws-title">日历小组件样式</div>
      <div class="ws-row">
        <span class="ws-label">背景色</span>
        <input type="color" id="cal-bg" value="#ffffff" />
        <span class="ws-label">透明度</span>
        <input type="range" id="cal-bgalpha" min="0" max="100" value="80" style="flex:1" />
        <span id="cal-bgalpha-v" class="ws-val">80%</span>
      </div>
      <div class="ws-row">
        <span class="ws-label">字体色</span>
        <input type="color" id="cal-fg" value="#3c4043" />
        <span class="ws-label">数字字体</span>
        <select id="cal-font" class="ws-select">
          <option value="square">方正（Bahnschrift）</option>
          <option value="round">圆润（Segoe UI）</option>
          <option value="mono">等宽（Consolas）</option>
        </select>
        <label class="ws-check">
          <input type="checkbox" id="cal-nobg" /> 仅数字（无背景）
        </label>
      </div>
      <div class="hint">点日历卡片可切换"月历 ⇄ 大字日期"两种形态</div>
    </div>
    <div class="row" style="align-items:center;gap:8px">
      <span style="font-size:13px;color:#333;white-space:nowrap;width:96px">便笺底色</span>
      <input type="range" id="note-slider" min="5" max="95" value="30" style="flex:1" />
      <span id="note-value" style="font-size:13px;color:#555;width:36px;text-align:right">30%</span>
    </div>
    <div class="row" style="align-items:center;gap:8px">
      <span style="font-size:13px;color:#333;white-space:nowrap;width:96px">内容区</span>
      <input type="range" id="content-slider" min="5" max="95" value="36" style="flex:1" />
      <span id="content-value" style="font-size:13px;color:#555;width:36px;text-align:right">36%</span>
    </div>
    <div class="row" style="align-items:center;gap:8px">
      <span style="font-size:13px;color:#333;white-space:nowrap;width:96px">标题栏</span>
      <input type="range" id="title-slider" min="0" max="95" value="20" style="flex:1" />
      <span id="title-value" style="font-size:13px;color:#555;width:36px;text-align:right">20%</span>
    </div>
    <div class="hint">三个板块各自独立：底色 = 卡片纸片；内容区 = 富文本/预览/TODO 列表；标题栏 = 顶部白膜（0% = 不显示）</div>
    <div class="row">
      <button id="quit-btn" style="background:#ffd0c0">退出应用（干净退出，避免残留进程）</button>
    </div>
    <div id="status"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
