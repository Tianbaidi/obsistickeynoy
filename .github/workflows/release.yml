name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装依赖
        run: npm install

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ObsiStickeyNoy ${{ github.ref_name }}"
          releaseBody: |
            桌面便笺 + 日历/时钟小组件，与 Obsidian 库双向同步。

            ## 安装
            - 下载 `ObsiStickeyNoy_*_x64-setup.exe` 运行安装
            - 需要 Windows 10/11 + WebView2 运行时（系统一般自带）

            ## v0.2.0 新增：人性化双链
            - 每张便笺左下角 🔗 按钮：一键指向其他便笺（`[[note-<id>|标题]]`，Obsidian 里可解析且显示友好标题）
            - "选择其他文件…"：从硬盘任意位置导入文件，复制进库内 `Obsi_StickeyNoy/assets/` 后以 `[[]]` 引用（图片插 `![[]]`）
            - 图片用 `![[图片]]` 嵌入并渲染，随便笺宽度自动缩放（点击放大原尺寸）
            - 预览里点击 wikilink 直接跳转到目标便笺窗口

            ## 使用
            - 首次启动在设置里选择你的 Obsidian 库路径
            - 便笺数据以 Markdown 存在库的 `Obsi_StickeyNoy/` 目录
            - 托盘菜单：新建便笺 / 新建 TODO / 设置 / 退出
          releaseDraft: true
          prerelease: false
